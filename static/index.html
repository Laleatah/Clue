<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clue Platform — Панель управления</title>
    <style>
        :root {
            --bg-base: #f8fafc; --bg-surface: #ffffff; --text-main: #0f172a; --text-muted: #64748b;
            --primary: #6366f1; --primary-hover: #4f46e5; --primary-light: #e0e7ff;
            --danger: #ef4444; --danger-light: #fee2e2; --border: #e2e8f0;
            --radius-lg: 12px; --radius-md: 8px; --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); min-width: 360px; padding: 40px 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 840px; display: flex; flex-direction: column; gap: 24px; }
        .hidden { display: none !important; }
        .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 28px; box-shadow: var(--shadow-sm); }
        .auth-card { max-width: 420px; width: 100%; margin: 40px auto; }
        h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.875rem; }
        .form-control { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.95rem; }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12); }
        .form-inline { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 18px; }
        .form-filters { display: flex; flex-wrap: wrap; gap: 12px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; border: 1px solid transparent; border-radius: var(--radius-md); font-size: 0.9rem; font-weight: 500; cursor: pointer; gap: 6px; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-danger { background-color: var(--danger-light); color: var(--danger); }
        .btn-secondary { background-color: #fff; border-color: var(--border); color: var(--text-main); }
        .btn-link { background: none; border: none; color: var(--primary); font-weight: 600; cursor: pointer; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 28px; }
        .user-badge { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 32px; height: 32px; background: var(--primary-light); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; }
        .error-banner { background-color: var(--danger-light); color: var(--danger); padding: 14px 18px; border-radius: var(--radius-md); font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; }
        .stat-card { background: var(--bg-base); border: 1px solid var(--border); padding: 18px; border-radius: var(--radius-md); }
        .stat-val { font-size: 1.75rem; font-weight: 700; }
        .item-list { display: flex; flex-direction: column; gap: 14px; }
        .data-item { border: 1px solid var(--border); padding: 22px; border-radius: var(--radius-md); background: #fff; position: relative; }
        .data-item h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; padding-right: 140px; }
        .data-item p { font-size: 0.95rem; color: #334155; margin-bottom: 14px; }
        .meta-tags { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.8rem; font-weight: 500; }
        .badge { padding: 4px 10px; border-radius: 20px; background: var(--bg-base); color: var(--text-muted); border: 1px solid var(--border); }
        .badge-primary { background: var(--primary-light); color: var(--primary); border-color: transparent; }
        .data-item .actions { position: absolute; top: 22px; right: 22px; display: flex; gap: 6px; }
        .status-msg { text-align: center; padding: 40px 20px; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .spinner { width: 24px; height: 24px; border: 2.5px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .pagination-bar { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 20px; margin-top: 20px;}
    </style>
</head>
<body>
<div class="container">
    <div id="errorBanner" class="error-banner hidden">⚠️ <span id="errorText"></span></div>

    <!-- ВХОД -->
    <div id="loginScreen" class="card auth-card hidden">
        <h2>🔑 Вход в систему</h2>
        <form id="loginForm">
            <div class="form-group"><label>Логин</label><input type="text" id="loginUsername" class="form-control" required></div>
            <div class="form-group"><label>Пароль</label><input type="password" id="loginPassword" class="form-control" required></div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Войти</button>
        </form>
        <p style="margin-top: 20px; text-align: center;">Нет аккаунта? <button class="btn-link" onclick="switchScreen('registerScreen')">Зарегистрироваться</button></p>
    </div>

    <!-- РЕГИСТРАЦИЯ -->
    <div id="registerScreen" class="card auth-card hidden">
        <h2>📝 Регистрация</h2>
        <form id="registerForm">
            <div class="form-group"><label>Логин</label><input type="text" id="regUsername" class="form-control" required minlength="3"></div>
            <div class="form-group"><label>Пароль</label><input type="password" id="regPassword" class="form-control" required minlength="6"></div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Создать аккаунт</button>
        </form>
        <p style="margin-top: 20px; text-align: center;">Уже есть аккаунт? <button class="btn-link" onclick="switchScreen('loginScreen')">Войти</button></p>
    </div>

    <!-- ГЛАВНАЯ -->
    <div id="mainScreen" class="hidden" style="display: flex; flex-direction: column; gap: 24px;">
        <div class="card header">
            <div class="user-badge">
                <div class="user-avatar" id="avatarLetter">U</div>
                <div>
                    <div style="font-size: 0.75rem; color: var(--text-muted);">Текущая сессия</div>
                    <div id="currentUserName" style="font-weight: 600;">Пользователь</div>
                </div>
            </div>
            <button class="btn btn-danger" onclick="handleLogout()">🚪 Выйти</button>
        </div>

        <div class="card">
            <h2>📊 Сводная аналитика</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div style="font-size: 0.75rem; color: var(--text-muted);">Всего записей</div>
                    <div class="stat-val" id="statTotal">0</div>
                </div>
            </div>
        </div>

        <!-- ФОРМА -->
        <div class="card">
            <h2 id="formTitle">✨ Создать новую запись</h2>
            <form id="entityForm">
                <input type="hidden" id="entityId">
                <div class="form-group"><label>Название записи</label><input type="text" id="entityTitle" class="form-control" required></div>
                <div class="form-group"><label>Детальное описание</label><textarea id="entityContent" class="form-control" required></textarea></div>
                <div class="form-inline">
                    <div>
                        <label>Категория</label>
                        <input type="text" id="entityCategory" class="form-control" placeholder="Общее">
                    </div>
                    <div>
                        <label>Статус</label>
                        <select id="entityStatus" class="form-control">
                            <option value="active">🟢 Активно</option>
                            <option value="completed">🔴 Завершено</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Картинка (опционально)</label>
                    <input type="file" id="entityImage" class="form-control" accept="image/*">
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="submit" id="submitEntityBtn" class="btn btn-primary">Сохранить запись</button>
                    <button type="button" id="cancelEditBtn" class="btn btn-secondary hidden" onclick="resetEntityForm()">Отмена</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>🔍 Фильтрация и поиск</h2>
            <div class="form-filters">
                <input type="text" id="searchField" class="form-control" placeholder="Поиск по названию...">
                <input type="text" id="filterField" class="form-control" placeholder="Категория...">
                <select id="sortField" class="form-control">
                    <option value="created_at_desc">Сначала новые</option>
                    <option value="created_at_asc">Сначала старые</option>
                    <option value="title_asc">По алфавиту</option>
                </select>
                <button class="btn btn-primary" onclick="loadData(0)">Применить</button>
            </div>
        </div>

        <div class="card">
            <h2>🗂️ Реестр записей</h2>
            <div id="listStatus" class="status-msg hidden"></div>
            <div id="itemList" class="item-list"></div>
            <div class="pagination-bar">
                <button id="prevPageBtn" class="btn btn-secondary" disabled>◀ Назад</button>
                <span id="pageInfo">Страница 1</span>
                <button id="nextPageBtn" class="btn btn-secondary" disabled>Вперед ▶</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentUser = null;
    let currentPage = 0;
    const limit = 5;

    function switchScreen(screenId) {
        ['loginScreen', 'registerScreen', 'mainScreen'].forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
        hideError();
    }
    function showError(msg) { document.getElementById('errorText').textContent = msg; document.getElementById('errorBanner').classList.remove('hidden'); }
    function hideError() { document.getElementById('errorBanner').classList.add('hidden'); }

    // API запросы (fetch автоматически шлет куки, т.к. один домен)
    async function apiRequest(url, options = {}) {
        hideError();
        try {
            const response = await fetch(url, options);
            if (response.status === 401) { switchScreen('loginScreen'); return null; }
            if (response.status === 403 || response.status === 422 || response.status === 404) {
                const errData = await response.json();
                showError(`Ошибка ${response.status}: ${JSON.stringify(errData.detail)}`);
                return null;
            }
            if (response.status === 204) return true;
            return await response.json();
        } catch (e) { showError('Сервер недоступен.'); return null; }
    }

    async function checkAuth() {
        const user = await apiRequest('/api/auth/me');
        if (user) {
            currentUser = user;
            document.getElementById('currentUserName').textContent = user.username;
            document.getElementById('avatarLetter').textContent = user.username.charAt(0).toUpperCase();
            switchScreen('mainScreen');
            loadData(0);
        } else { switchScreen('loginScreen'); }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = await apiRequest('/api/auth/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: document.getElementById('loginUsername').value, password: document.getElementById('loginPassword').value })
        });
        if (data) { checkAuth(); }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = await apiRequest('/api/auth/register', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: document.getElementById('regUsername').value, password: document.getElementById('regPassword').value })
        });
        if (data) { showError('Успешно! Теперь войдите.'); switchScreen('loginScreen'); }
    });

    async function handleLogout() {
        await apiRequest('/api/auth/logout', { method: 'POST' });
        switchScreen('loginScreen');
    }

    async function loadData(page = 0) {
        currentPage = page;
        const listContainer = document.getElementById('itemList');
        const statusContainer = document.getElementById('listStatus');
        listContainer.innerHTML = '';
        statusContainer.innerHTML = '<div class="spinner"></div><span>Загрузка...</span>';
        statusContainer.classList.remove('hidden');

        const search = document.getElementById('searchField').value;
        const category = document.getElementById('filterField').value;
        const sort = document.getElementById('sortField').value;
        const offset = currentPage * limit;

        const result = await apiRequest(`/api/posts?limit=${limit}&offset=${offset}&search=${encodeURIComponent(search)}&category=${encodeURIComponent(category)}&sort=${sort}`);
        loadStats();

        if (!result || !result.items || result.items.length === 0) {
            statusContainer.textContent = '📭 Записей не найдено.';
            updatePagination(0);
            return;
        }

        statusContainer.classList.add('hidden');

        result.items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'data-item';
            
            const h3 = document.createElement('h3'); h3.textContent = item.title;
            const p = document.createElement('p'); p.textContent = item.content;
            // Блок для отображения картинки
            if (item.image_url) {
                const img = document.createElement('img');
                img.src = item.image_url;
                // Добавляем немного стилей, чтобы картинка не разрывала сайт
                img.style.maxWidth = '100%';
                img.style.maxHeight = '300px';
                img.style.borderRadius = '8px';
                img.style.marginBottom = '14px';
                img.style.display = 'block';
                div.appendChild(img);
            }
            
            const meta = document.createElement('div'); meta.className = 'meta-tags';
            const cat = document.createElement('span'); cat.className = 'badge badge-primary'; cat.textContent = `📁 ${item.category}`;
            const stat = document.createElement('span'); stat.className = 'badge'; stat.textContent = item.status === 'active' ? '🟢 Активно' : '⚪ Завершено';
            meta.append(cat, stat);

            const actions = document.createElement('div'); actions.className = 'actions';
            // Кнопки редактирования и удаления видны только если пост принадлежит текущему юзеру (ТЗ п.3.1)
            if (item.owner_id === currentUser.id) {
                const editBtn = document.createElement('button'); editBtn.className = 'btn btn-secondary'; editBtn.textContent = '✏️'; editBtn.onclick = () => startEdit(item);
                const delBtn = document.createElement('button'); delBtn.className = 'btn btn-danger'; delBtn.textContent = '🗑️'; delBtn.onclick = () => handleDelete(item.id);
                actions.append(editBtn, delBtn);
            }

            div.append(h3, p, meta, actions);
            listContainer.appendChild(div);
        });

        updatePagination(result.total);
    }

    function updatePagination(total) {
        document.getElementById('pageInfo').textContent = `Страница ${currentPage + 1}`;
        document.getElementById('prevPageBtn').disabled = (currentPage === 0);
        document.getElementById('nextPageBtn').disabled = ((currentPage + 1) * limit >= total);
    }

    document.getElementById('prevPageBtn').onclick = () => { if (currentPage > 0) loadData(currentPage - 1); };
    document.getElementById('nextPageBtn').onclick = () => { loadData(currentPage + 1); };

    async function loadStats() {
        const stats = await apiRequest('/api/posts/stats');
        if (stats) document.getElementById('statTotal').textContent = stats.total_count;
    }

    // Отправка формы (Создание или Обновление)
    document.getElementById('entityForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('entityId').value;
        const formData = new FormData();
        formData.append('title', document.getElementById('entityTitle').value);
        formData.append('content', document.getElementById('entityContent').value);
        formData.append('category', document.getElementById('entityCategory').value || 'Общее');
        formData.append('status', document.getElementById('entityStatus').value);
        
        const file = document.getElementById('entityImage').files[0];
        if (file) formData.append('image', file);

        let url = '/api/posts';
        let method = 'POST';

        if (id) {
            // Если это редактирование (PATCH), отправляем JSON, а не FormData 
            url = `/api/posts/${id}`;
            method = 'PATCH';
            const jsonData = {
                title: document.getElementById('entityTitle').value,
                content: document.getElementById('entityContent').value,
                category: document.getElementById('entityCategory').value,
                status: document.getElementById('entityStatus').value
            };
            const res = await apiRequest(url, {
                method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(jsonData)
            });
            if (res) { resetEntityForm(); loadData(currentPage); }
            return;
        }

        // Если создание (POST)
        const res = await apiRequest(url, { method: method, body: formData });
        if (res) { resetEntityForm(); loadData(currentPage); }
    });

    function startEdit(item) {
        document.getElementById('formTitle').textContent = '📝 Редактировать запись';
        document.getElementById('entityId').value = item.id;
        document.getElementById('entityTitle').value = item.title;
        document.getElementById('entityContent').value = item.content;
        document.getElementById('entityCategory').value = item.category;
        document.getElementById('entityStatus').value = item.status;
        document.getElementById('submitEntityBtn').textContent = 'Применить';
        document.getElementById('cancelEditBtn').classList.remove('hidden');
        window.scrollTo(0, 0);
    }

    function resetEntityForm() {
        document.getElementById('formTitle').textContent = '✨ Создать новую запись';
        document.getElementById('entityId').value = '';
        document.getElementById('entityForm').reset();
        document.getElementById('submitEntityBtn').textContent = 'Сохранить';
        document.getElementById('cancelEditBtn').classList.add('hidden');
    }

    async function handleDelete(id) {
        if (confirm('Удалить запись?')) {
            const success = await apiRequest(`/api/posts/${id}`, { method: 'DELETE' });
            if (success) loadData(currentPage);
        }
    }

    window.addEventListener('DOMContentLoaded', checkAuth);
</script>
</body>
</html>
